<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="Bilder av Birk">
<meta property="og:description" content="Här samlar vi foton och videor till minne av Birk. Dela gärna dina bilder — information om begravningen publiceras också här.">
<meta property="og:image" content="https://birkbilder.com/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:url" content="https://birkbilder.com/gallery.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%96%BC%3C/text%3E%3C/svg%3E">
<title>Admin · Bilder av Birk</title>
<style>
  :root { --accent: #2563eb; --bg: #f4f5f7; --text: #1a1d21; --muted: #6b7280; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.4rem; margin-bottom: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; align-items: center; }
  select, .btn { font-size: 0.9rem; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; cursor: pointer; }
  .chk { font-size: 0.85rem; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); cursor: pointer; }
  .btn.danger { background: #dc2626; border-color: #dc2626; color: #fff; }
  .tile.sel { outline: 3px solid #dc2626; outline-offset: -3px; }
  .tile .selMark { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%;
                   background: #dc2626; color: #fff; display: none; align-items: center; justify-content: center;
                   font-size: 0.85rem; z-index: 2; }
  .tile.sel .selMark { display: flex; }
  .count { color: var(--muted); font-size: 0.9rem; margin-left: auto; }
  .group-title { font-weight: 700; margin: 22px 0 10px; font-size: 1.05rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .tile { position: relative; display: block; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: #e5e7eb; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .noThumb { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 0.8rem; padding: 8px; text-align: center; }
  .meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; font-size: 0.72rem; color: #fff;
          background: linear-gradient(transparent, rgba(0,0,0,.65)); }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  /* lightbox */
  #modal { position: fixed; inset: 0; background: rgba(10,10,12,.93); z-index: 50;
           display: flex; align-items: center; justify-content: center; }
  #modal[hidden] { display: none; }
  #modalImg, #modalVid { max-width: 94vw; max-height: 82vh; object-fit: contain; border-radius: 6px;
              box-shadow: 0 8px 40px rgba(0,0,0,.6); user-select: none; }
  .mBtn { position: absolute; top: 50%; transform: translateY(-50%); width: 54px; height: 84px;
          border: none; border-radius: 12px; background: rgba(255,255,255,.09); color: #fff;
          font-size: 2rem; cursor: pointer; }
  .mBtn:hover { background: rgba(255,255,255,.2); }
  #mPrev { left: 8px; } #mNext { right: 8px; }
  #mClose { position: absolute; top: 10px; right: 12px; width: 44px; height: 44px; border: none;
            border-radius: 50%; background: rgba(255,255,255,.12); color: #fff; font-size: 1.3rem; cursor: pointer; }
  #mBar { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px; text-align: center;
          color: #e5e7eb; font-size: 0.9rem; background: linear-gradient(transparent, rgba(0,0,0,.7)); }
  #mBar a { color: #93c5fd; }
  #mBar button { border: none; border-radius: 6px; padding: 4px 10px; font-size: 0.85rem; cursor: pointer;
                 background: rgba(255,255,255,.15); color: #fff; margin-left: 6px; }
  #mDate { border: none; border-radius: 6px; padding: 3px 6px; font-size: 0.85rem; margin-left: 6px; }
  #mCount { position: absolute; top: 16px; left: 16px; color: #9ca3af; font-size: 0.85rem; }
  /* slideshow */
  #slideshow { position: fixed; inset: 0; background: #000; z-index: 70; cursor: none; }
  #slideshow[hidden] { display: none; }
  #slideshow img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
                   opacity: 0; transition: opacity 1.2s ease; }
  #slideshow img.on { opacity: 1; }
  #ssCap { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; z-index: 2;
           color: rgba(255,255,255,.75); font-size: 1rem; text-shadow: 0 1px 6px #000; }
  #ssExit { position: absolute; top: 14px; right: 16px; z-index: 2; width: 44px; height: 44px;
            border: none; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff;
            font-size: 1.2rem; cursor: pointer; opacity: .35; }
  #ssExit:hover { opacity: 1; }
  /* share dialog */
  #share { position: fixed; inset: 0; background: rgba(10,10,12,.55); z-index: 60;
           display: flex; align-items: center; justify-content: center; padding: 16px; }
  #share[hidden] { display: none; }
  .shareCard { background: #fff; border-radius: 16px; padding: 22px; max-width: 420px; width: 100%;
               max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 50px rgba(0,0,0,.35); position: relative; }
  .shareCard h2 { font-size: 1.1rem; margin-bottom: 12px; }
  #shareQr { display: flex; justify-content: center; margin: 10px 0; }
  #shareQr svg { width: 220px; height: 220px; }
  .shareUrl { display: flex; gap: 8px; margin: 10px 0; }
  .shareUrl input { flex: 1; font-size: 0.9rem; padding: 10px; border: 1.5px solid #d1d5db; border-radius: 8px; }
  .shareMsg { width: 100%; font-size: 0.9rem; padding: 10px; border: 1.5px solid #d1d5db; border-radius: 8px;
              font-family: inherit; resize: vertical; min-height: 88px; margin: 6px 0 10px; }
  .shareRow { display: flex; gap: 8px; flex-wrap: wrap; }
  .shareBtn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 600;
              cursor: pointer; background: var(--accent); color: #fff; white-space: nowrap; }
  .shareBtn.wa { background: #25d366; }
  .shareBtn.ghost { background: #eef2f7; color: var(--text); }
  #shareClose { position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; border: none;
                border-radius: 50%; background: #eef2f7; font-size: 1rem; cursor: pointer; }
  .shareHint { color: var(--muted); font-size: 0.82rem; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Gallery</h1>
  <div class="controls">
    <select id="sortBy">
      <option value="taken_desc">Date taken ↓ (newest first)</option>
      <option value="taken_asc">Date taken ↑ (oldest first)</option>
      <option value="uploaded_desc">Upload time ↓</option>
      <option value="uploader">Group by uploader</option>
    </select>
    <select id="who"><option value="">Everyone</option></select>
    <!-- hidden for now, fully functional — remove `hidden` to expose -->
    <button class="btn" id="dlAll" hidden>⬇ Download all</button>
    <button class="btn" id="shareBtn">📤 Share</button>
    <button class="btn" id="ssBtn">▶ Slideshow</button>
    <label class="chk"><input type="checkbox" id="hideWa"> hide 💬 re-shares</label>
    <button class="btn" id="selBtn" hidden>🗑 Select</button>
    <button class="btn" id="selCancel" hidden>Cancel</button>
    <button class="btn danger" id="delBtn" hidden>Delete (0)</button>
    <span class="count" id="count"></span>
  </div>
  <div id="content"><p class="empty">Loading…</p></div>
</div>

<div id="slideshow" hidden>
  <img id="ssImgA" alt=""><img id="ssImgB" alt="">
  <div id="ssCap"></div>
  <button id="ssExit" aria-label="Exit slideshow">✕</button>
</div>

<div id="share" hidden>
  <div class="shareCard">
    <button id="shareClose" aria-label="Close">✕</button>
    <h2>Invite people to share photos</h2>
    <div id="shareQr"></div>
    <div class="shareUrl">
      <input id="shareUrlInput" readonly>
      <button class="shareBtn ghost" id="copyUrl" style="flex:0">Copy</button>
    </div>
    <textarea class="shareMsg" id="shareMsg"></textarea>
    <div class="shareRow">
      <button class="shareBtn wa" id="waShare">Share on WhatsApp</button>
      <button class="shareBtn" id="nativeShare" hidden>Share…</button>
    </div>
    <p class="shareHint">The QR code and link include the access key — anyone who gets them can upload and view. Share within the group only.</p>
  </div>
</div>

<div id="modal" hidden>
  <span id="mCount"></span>
  <img id="modalImg" alt="">
  <video id="modalVid" controls playsinline hidden></video>
  <button class="mBtn" id="mPrev" aria-label="Previous">‹</button>
  <button class="mBtn" id="mNext" aria-label="Next">›</button>
  <button id="mClose" aria-label="Close">✕</button>
  <div id="mBar"><span id="mCap"></span> · <a id="mOrig" target="_blank" rel="noopener">full quality ↗</a><button id="mEdit" hidden>✎ date</button><span id="mEditForm" hidden><input type="datetime-local" id="mDate"><button id="mSave">Save</button><button id="mEditCancel">✕</button></span></div>
</div>

<script src="./config.js"></script>
<script src="./qrcode.js"></script>
<script>
const CFG = window.PC_CONFIG;
document.getElementById('title').textContent = CFG.eventTitle + ' — Gallery';
document.title = 'Admin · ' + CFG.eventTitle;

// The access key travels in the shared link and sticks in localStorage.
// localStorage can throw in strict/private browsing — degrade to URL-only.
let storedKey = null;
try { storedKey = localStorage.getItem('pc_key'); } catch (e) { /* ignore */ }
const KEY = new URLSearchParams(location.search).get('k') || storedKey || '';
if (new URLSearchParams(location.search).get('k')) {
  try { localStorage.setItem('pc_key', KEY); } catch (e) { /* session-only */ }
}

const contentEl = document.getElementById('content');
const sortEl = document.getElementById('sortBy');
const whoEl = document.getElementById('who');
const countEl = document.getElementById('count');
let photos = [];

const publicUrl = p => `${CFG.supabaseUrl}/storage/v1/object/public/photos/${p}`;

async function load() {
  if (!KEY) { contentEl.innerHTML = '<p class="empty">This page needs the personal link you were sent.</p>'; return; }
  const res = await fetch(`${CFG.supabaseUrl}/rest/v1/photos?select=*&order=taken_at.desc.nullslast&limit=5000`, {
    headers: { apikey: CFG.anonKey, Authorization: `Bearer ${CFG.anonKey}`, 'x-collect-key': KEY },
  });
  if (!res.ok) { contentEl.innerHTML = `<p class="empty">Failed to load: ${res.status}</p>`; return; }
  photos = await res.json();

  const uploaders = [...new Set(photos.map(p => p.uploader))].sort((a, b) => a.localeCompare(b));
  for (const u of uploaders) {
    const opt = document.createElement('option');
    opt.value = u; opt.textContent = u;
    whoEl.appendChild(opt);
  }
  render();
}

const fmt = iso => iso ? new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : 'unknown date';
const fmtDay = iso => iso ? new Date(iso).toLocaleDateString(undefined, { dateStyle: 'full' }) : 'Unknown date';

// Tiles are created in display order, so viewList mirrors exactly what the
// user sees under the active filter + sort — the modal browses that order.
let viewList = [];

function tile(p) {
  const idx = viewList.length;
  viewList.push(p);
  const a = document.createElement('a');
  a.className = 'tile';
  a.href = publicUrl(p.storage_path);
  a.target = '_blank';
  a.title = `${p.uploader} — ${fmt(p.taken_at)} — ${p.original_name || ''}`;
  a.addEventListener('click', (e) => {
    if (selectMode) {
      e.preventDefault();
      if (selected.has(p.id)) { selected.delete(p.id); a.classList.remove('sel'); }
      else { selected.add(p.id); a.classList.add('sel'); }
      updateDelBtn();
      return;
    }
    if (e.metaKey || e.ctrlKey || e.shiftKey) return; // keep open-in-new-tab working
    e.preventDefault();
    openModal(idx);
  });
  a.innerHTML = (p.thumb_path
    ? `<img loading="lazy" src="${publicUrl(p.thumb_path)}" alt="">`
    : `<div class="noThumb">${p.original_name || 'photo'}<br>(no preview)</div>`)
    + '<span class="selMark">✓</span>';
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = `${(p.content_type || '').startsWith('video/') ? '🎬 ' : ''}${p.suspected_reshare ? '💬 ' : ''}${p.uploader} · ${fmt(p.taken_at)}`;
  a.appendChild(meta);
  return a;
}

function render() {
  closeModal();
  selected.clear();
  updateDelBtn();
  viewList = [];
  const who = whoEl.value;
  let list = who ? photos.filter(p => p.uploader === who) : [...photos];
  if (document.getElementById('hideWa').checked) list = list.filter(p => !p.suspected_reshare);
  countEl.textContent = `${list.length} photo${list.length === 1 ? '' : 's'}`;
  contentEl.innerHTML = '';
  if (!list.length) { contentEl.innerHTML = '<p class="empty">No photos yet.</p>'; return; }

  const sort = sortEl.value;
  const byTaken = (a, b) => (a.taken_at || '') < (b.taken_at || '') ? -1 : 1;

  if (sort === 'uploader') {
    list.sort(byTaken);
    const groups = new Map();
    for (const p of list) {
      if (!groups.has(p.uploader)) groups.set(p.uploader, []);
      groups.get(p.uploader).push(p);
    }
    for (const [name, ps] of [...groups].sort((a, b) => a[0].localeCompare(b[0]))) {
      const h = document.createElement('div');
      h.className = 'group-title';
      h.textContent = `${name} (${ps.length})`;
      contentEl.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'grid';
      ps.forEach(p => grid.appendChild(tile(p)));
      contentEl.appendChild(grid);
    }
    return;
  }

  if (sort === 'taken_asc') list.sort(byTaken);
  else if (sort === 'taken_desc') list.sort((a, b) => byTaken(b, a));
  else list.sort((a, b) => (a.uploaded_at < b.uploaded_at ? 1 : -1));

  // group by day for date sorts
  const groups = new Map();
  for (const p of list) {
    const key = p.taken_at ? p.taken_at.slice(0, 10) : 'unknown';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  }
  if (sort.startsWith('taken')) {
    for (const [, ps] of groups) {
      const h = document.createElement('div');
      h.className = 'group-title';
      h.textContent = fmtDay(ps[0].taken_at);
      contentEl.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'grid';
      ps.forEach(p => grid.appendChild(tile(p)));
      contentEl.appendChild(grid);
    }
  } else {
    const grid = document.createElement('div');
    grid.className = 'grid';
    list.forEach(p => grid.appendChild(tile(p)));
    contentEl.appendChild(grid);
  }
}

// --- lightbox ---
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const mCap = document.getElementById('mCap');
const mOrig = document.getElementById('mOrig');
const mCount = document.getElementById('mCount');
let modalIdx = -1;

function openModal(i) {
  modalIdx = i;
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  showCurrent();
}

const modalVid = document.getElementById('modalVid');
const isVideoPhoto = p => (p.content_type || '').startsWith('video/');

function closeModal() {
  if (modal.hidden) return;
  modal.hidden = true;
  document.body.style.overflow = '';
  modalImg.src = '';
  modalVid.pause();
  modalVid.removeAttribute('src');
  modalVid.load();
  if (datesChanged) { // re-sort/regroup with the corrected dates
    datesChanged = false;
    render();
  }
}

function showCurrent() {
  const p = viewList[modalIdx];
  if (!p) return;
  const video = isVideoPhoto(p);
  modalImg.hidden = video;
  modalVid.hidden = !video;
  if (video) {
    modalImg.src = '';
    modalVid.src = publicUrl(p.storage_path);
    modalVid.poster = p.thumb_path ? publicUrl(p.thumb_path) : '';
  } else {
    modalVid.pause();
    modalVid.removeAttribute('src');
    modalVid.load();
    modalImg.src = publicUrl(p.thumb_path || p.storage_path);
  }
  mCap.textContent = `${video ? '🎬 ' : ''}${p.uploader} · ${fmt(p.taken_at)}`;
  mOrig.href = publicUrl(p.storage_path);
  mCount.textContent = `${modalIdx + 1} / ${viewList.length}`;
  mEdit.hidden = !ADMIN;
  mEditForm.hidden = true;
  for (const d of [1, -1]) { // preload neighbours for instant stepping
    const n = viewList[(modalIdx + d + viewList.length) % viewList.length];
    if (n?.thumb_path) new Image().src = publicUrl(n.thumb_path);
  }
}

function step(d) {
  modalIdx = (modalIdx + d + viewList.length) % viewList.length;
  showCurrent();
}

document.getElementById('mPrev').addEventListener('click', () => step(-1));
document.getElementById('mNext').addEventListener('click', () => step(1));
document.getElementById('mClose').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

document.addEventListener('keydown', (e) => {
  if (modal.hidden) return;
  if (e.target.tagName === 'INPUT') return; // typing in the date editor
  if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'Escape') closeModal();
});

// --- admin: correct a photo's date (lightbox) ---
const mEdit = document.getElementById('mEdit');
const mEditForm = document.getElementById('mEditForm');
const mDate = document.getElementById('mDate');
let datesChanged = false;

mEdit.addEventListener('click', () => {
  const p = viewList[modalIdx];
  if (!p) return;
  const d = p.taken_at ? new Date(p.taken_at) : new Date();
  mDate.value = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  mEdit.hidden = true;
  mEditForm.hidden = false;
});

document.getElementById('mEditCancel').addEventListener('click', () => {
  mEditForm.hidden = true;
  mEdit.hidden = !ADMIN;
});

document.getElementById('mSave').addEventListener('click', async (e) => {
  const p = viewList[modalIdx];
  if (!p || !mDate.value) return;
  const iso = new Date(mDate.value).toISOString();
  e.target.disabled = true;
  try {
    const res = await fetch(`${CFG.gateUrl}/edit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ k: KEY, adminKey: ADMIN, id: p.id, takenAt: iso }),
    });
    if (!res.ok) throw new Error(res.status === 403 ? 'Admin key not accepted.' : `Save failed (${res.status}).`);
    p.taken_at = iso;
    datesChanged = true;
    showCurrent();
  } catch (err) {
    alert(err.message);
  } finally {
    e.target.disabled = false;
  }
});

let touchX = null, touchY = null;
modal.addEventListener('touchstart', (e) => {
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
}, { passive: true });
modal.addEventListener('touchend', (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  touchX = touchY = null;
  if (Math.abs(dx) > 40 && Math.abs(dy) < 80) step(dx < 0 ? 1 : -1);
}, { passive: true });

// --- download all (respects the active filter) ---
const dlBtn = document.getElementById('dlAll');
dlBtn.addEventListener('click', downloadAll);

async function downloadAll() {
  const list = [...viewList];
  if (!list.length) { alert('No photos to download.'); return; }
  dlBtn.disabled = true;
  const origLabel = dlBtn.textContent;
  try {
    const { downloadZip } = await import('./client-zip.js');
    const safe = s => (s || 'unknown').replace(/[^\w. -]/g, '_').trim() || 'unknown';
    const seen = new Map();
    let n = 0;

    async function* files() {
      for (const p of list) {
        dlBtn.textContent = `⬇ ${++n}/${list.length}…`;
        const res = await fetch(publicUrl(p.storage_path));
        if (!res.ok) continue;
        const stamp = p.taken_at ? p.taken_at.slice(0, 19).replace(/:/g, '-').replace('T', '_') : 'no-date';
        let name = `${safe(p.uploader)}/${stamp}_${safe(p.original_name || p.storage_path.split('/').pop())}`;
        const dup = seen.get(name) || 0;
        seen.set(name, dup + 1);
        if (dup) name = name.replace(/(\.[^./]*)?$/, `_${dup}$1`);
        yield { name, input: res, lastModified: p.taken_at ? new Date(p.taken_at) : undefined };
      }
    }

    const zip = downloadZip(files());
    if (window.showSaveFilePicker) {
      // Chrome/Edge: stream straight to disk — no size limit worth worrying about.
      const handle = await showSaveFilePicker({
        suggestedName: 'bilder-av-birk.zip',
        types: [{ description: 'Zip archive', accept: { 'application/zip': ['.zip'] } }],
      });
      await zip.body.pipeTo(await handle.createWritable());
    } else {
      // Safari/Firefox: buffer in memory, fine up to ~1 GB.
      const blob = await zip.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'bilder-av-birk.zip';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    }
    dlBtn.textContent = '✓ done';
    setTimeout(() => { dlBtn.textContent = origLabel; }, 3000);
  } catch (e) {
    if (e.name !== 'AbortError') { console.error(e); alert('Download failed: ' + e.message); }
    dlBtn.textContent = origLabel;
  } finally {
    dlBtn.disabled = false;
  }
}

// --- slideshow (fullscreen, auto-advance with crossfade) ---
const ss = document.getElementById('slideshow');
const ssImgs = [document.getElementById('ssImgA'), document.getElementById('ssImgB')];
const ssCap = document.getElementById('ssCap');
const SS_INTERVAL = 5000;
let ssFront = 0, ssIdx = 0, ssTimer = null;

function ssShow(i) {
  const p = viewList[i];
  if (!p) return;
  const back = ssImgs[1 - ssFront];
  const url = publicUrl(p.thumb_path || p.storage_path);
  const pre = new Image();
  pre.onload = () => {
    back.src = url;
    back.classList.add('on');
    ssImgs[ssFront].classList.remove('on');
    ssFront = 1 - ssFront;
    ssCap.textContent = fmt(p.taken_at);
  };
  pre.onerror = () => { ssCap.textContent = `${fmt(p.taken_at)} (no preview)`; };
  pre.src = url;
}

function ssStep(d) {
  ssIdx = (ssIdx + d + viewList.length) % viewList.length;
  ssShow(ssIdx);
  clearInterval(ssTimer);
  ssTimer = setInterval(() => ssStep(1), SS_INTERVAL);
}

function startSlideshow() {
  if (!viewList.length) { alert('No photos to show.'); return; }
  ssIdx = !modal.hidden ? modalIdx : 0;
  closeModal();
  ss.hidden = false;
  document.body.style.overflow = 'hidden';
  const rf = ss.requestFullscreen || ss.webkitRequestFullscreen;
  if (rf) { try { rf.call(ss).catch(() => {}); } catch (e) { /* overlay fallback */ } }
  ssShow(ssIdx);
  ssTimer = setInterval(() => ssStep(1), SS_INTERVAL);
}

function stopSlideshow() {
  if (ss.hidden) return;
  clearInterval(ssTimer);
  ssTimer = null;
  ss.hidden = true;
  document.body.style.overflow = '';
  ssImgs.forEach(img => { img.classList.remove('on'); img.removeAttribute('src'); });
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

document.getElementById('ssBtn').addEventListener('click', startSlideshow);
document.getElementById('ssExit').addEventListener('click', stopSlideshow);
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) stopSlideshow(); // Esc in fullscreen lands here
});
document.addEventListener('keydown', (e) => {
  if (ss.hidden) return;
  if (e.key === 'Escape') stopSlideshow();
  else if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); ssStep(1); }
  else if (e.key === 'ArrowLeft') ssStep(-1);
});

// --- share dialog ---
const shareEl = document.getElementById('share');
const shareMsgEl = document.getElementById('shareMsg');
const shareUrlInput = document.getElementById('shareUrlInput');
const nativeShareBtn = document.getElementById('nativeShare');

function shareLink() {
  return `${location.origin}${location.pathname.replace(/gallery\.html$/, '')}?k=${encodeURIComponent(KEY)}`;
}

document.getElementById('shareBtn').addEventListener('click', () => {
  const url = shareLink();
  shareUrlInput.value = url;
  shareMsgEl.value = `Hej! Vi samlar bilder på Birk. Dela gärna dina bästa bilder här (ingen inloggning, tar bara en minut):\n\n${url}\n\nSkriv ditt namn, välj bilderna, klart — de sparas i full kvalitet.`;
  const qr = qrcode(0, 'M');
  qr.addData(url);
  qr.make();
  document.getElementById('shareQr').innerHTML = qr.createSvgTag({ cellSize: 5, margin: 8, scalable: true });
  nativeShareBtn.hidden = !navigator.share;
  shareEl.hidden = false;
});

document.getElementById('shareClose').addEventListener('click', () => { shareEl.hidden = true; });
shareEl.addEventListener('click', (e) => { if (e.target === shareEl) shareEl.hidden = true; });

document.getElementById('copyUrl').addEventListener('click', async (e) => {
  await navigator.clipboard.writeText(shareUrlInput.value);
  e.target.textContent = '✓';
  setTimeout(() => { e.target.textContent = 'Copy'; }, 1500);
});

document.getElementById('waShare').addEventListener('click', () => {
  window.open(`https://wa.me/?text=${encodeURIComponent(shareMsgEl.value)}`, '_blank');
});

nativeShareBtn.addEventListener('click', () => {
  navigator.share({ text: shareMsgEl.value }).catch(() => {});
});

// --- admin: multi-select delete (requires the separate admin key) ---
let adminStored = null;
try { adminStored = localStorage.getItem('pc_admin'); } catch (e) { /* ignore */ }
const ADMIN = new URLSearchParams(location.search).get('admin') || adminStored || '';
if (new URLSearchParams(location.search).get('admin')) {
  try { localStorage.setItem('pc_admin', ADMIN); } catch (e) { /* session-only */ }
}

const selBtn = document.getElementById('selBtn');
const selCancel = document.getElementById('selCancel');
const delBtn = document.getElementById('delBtn');
let selectMode = false;
const selected = new Set();
if (ADMIN) selBtn.hidden = false;

function updateDelBtn() {
  delBtn.hidden = !selectMode || selected.size === 0;
  delBtn.textContent = `Delete (${selected.size})`;
}

function setSelectMode(on) {
  selectMode = on;
  selected.clear();
  selBtn.hidden = on || !ADMIN;
  selCancel.hidden = !on;
  document.querySelectorAll('.tile.sel').forEach(el => el.classList.remove('sel'));
  updateDelBtn();
}

selBtn.addEventListener('click', () => setSelectMode(true));
selCancel.addEventListener('click', () => setSelectMode(false));

delBtn.addEventListener('click', async () => {
  const n = selected.size;
  if (!n) return;
  if (!confirm(`Delete ${n} photo${n === 1 ? '' : 's'} permanently?\nThis cannot be undone.`)) return;
  delBtn.disabled = true;
  try {
    const res = await fetch(`${CFG.gateUrl}/del`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ k: KEY, adminKey: ADMIN, ids: [...selected] }),
    });
    if (!res.ok) throw new Error(res.status === 403 ? 'Admin key not accepted.' : `Delete failed (${res.status}).`);
    const { deleted } = await res.json();
    photos = photos.filter(p => !selected.has(p.id));
    setSelectMode(false);
    render();
    countEl.textContent += ` — ${deleted} deleted`;
  } catch (e) {
    alert(e.message);
  } finally {
    delBtn.disabled = false;
  }
});

sortEl.addEventListener('change', render);
whoEl.addEventListener('change', render);
document.getElementById('hideWa').addEventListener('change', render);
load();
</script>
